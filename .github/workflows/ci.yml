name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: streamdeck-studiocoast-vmix
      - uses: actions/checkout@v4
        with:
          repository: MikanseiLaboratory/vmix-rs
          ref: feat/vmix-shortcuts
          path: vmix-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo test --workspace
        working-directory: streamdeck-studiocoast-vmix
      - run: cargo run -p vmix-plugin --bin typegen
        working-directory: streamdeck-studiocoast-vmix
      - run: npm ci
        working-directory: streamdeck-studiocoast-vmix/pi
      - run: npm run build
        working-directory: streamdeck-studiocoast-vmix/pi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: streamdeck-studiocoast-vmix
      - uses: actions/checkout@v4
        with:
          repository: MikanseiLaboratory/vmix-rs
          ref: feat/vmix-shortcuts
          path: vmix-rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p vmix-plugin --release --bin plugin --target ${{ matrix.target }}
        working-directory: streamdeck-studiocoast-vmix
