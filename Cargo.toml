[workspace]
resolver = "2"
members = ["crates/vmix-pool", "crates/vmix-plugin"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
urlencoding = "2.1.3"
uuid = { version = "1", features = ["v4", "serde"] }
vmix-rs = { path = "../vmix-rs/vmix-rs", default-features = false, features = ["tcp", "std"] }
